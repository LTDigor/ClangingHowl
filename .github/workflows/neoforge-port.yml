name: NeoForge 1.21.1 port verification

on:
  push:
    branches: [port/neoforge-1.21.1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neoforge-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Save exact source snapshot
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/commit.txt
          git archive --format=tar HEAD > verification/source.tar
      - name: Compile and test the complete mod
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --console=plain --stacktrace clean build 2>&1 | tee verification/build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-verification-${{ github.sha }}
          path: |
            verification/
            build/reports/
            build/test-results/
          if-no-files-found: error
          retention-days: 7
      - name: Upload successfully built JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: clanginghowl-neoforge-1.21.1-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
