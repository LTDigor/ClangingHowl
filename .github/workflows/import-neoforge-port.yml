name: Import and verify NeoForge 1.21.1 port

on:
  push:
    branches: [port/import-neoforge-1.21.1]

permissions:
  contents: read

jobs:
  import:
    if: github.repository == 'LTDigor/ClangingHowl'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply exact source delta
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          cat .port-import/part0{0,1,2,3,4,5,6}.b64 | base64 --decode > "$RUNNER_TEMP/manifest.json.xz"
          echo "8b5856c08b70816248cb4ca50660e2009681987b81707e2e7d07199d7272b67f  $RUNNER_TEMP/manifest.json.xz" | sha256sum --check
          cp .port-import/apply.py "$RUNNER_TEMP/apply-port.py"
          git fetch origin port/neoforge-1.21.1
          test "$(git rev-parse origin/port/neoforge-1.21.1)" = 55a6f173cd5c99a7883538354103a5f03c1af027
          git switch -C port/neoforge-1.21.1 origin/port/neoforge-1.21.1
          python3 "$RUNNER_TEMP/apply-port.py" "$RUNNER_TEMP/manifest.json.xz"
          git config user.name Vadim
          git config user.email 71977735+LTDigor@users.noreply.github.com
          git commit -m "port: migrate gameplay, rendering and data to NeoForge 1.21.1" -m "Preserve mod content and author credits. Migrate attachments, registries, item data, enchantments, entities, recipes, client APIs and data formats. Offline production symbol compilation and 30 static checks pass; real build and runtime verification are separate gates."
          git push origin HEAD:refs/heads/port/neoforge-1.21.1
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: import
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.import.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Record source and run static contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          git rev-parse HEAD > verification/commit.txt
          git archive --format=tar HEAD > verification/source.tar
          python3 tools/porting/test_network_scaffold.py
          python3 tools/porting/test_attachment_scaffold.py
          python3 tools/porting/test_resource_contracts.py
      - name: Compile and execute JUnit tests
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --console=plain clean build 2>&1 | tee verification/build.log
      - name: Load mod and generate data
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --console=plain runData 2>&1 | tee verification/datagen.log
      - name: Verify generated resources and build packaged mod
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- src/generated/resources > verification/datagen.diff
          tar -cf verification/generated-resources.tar src/generated/resources
          python3 tools/porting/test_resource_contracts.py
          bash ./gradlew --no-daemon --console=plain build 2>&1 | tee verification/package.log
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-verification-${{ needs.import.outputs.commit }}
          path: |
            verification/
            build/reports/
            build/test-results/
            run/logs/
            run/crash-reports/
          if-no-files-found: error
          retention-days: 3
      - name: Preserve verified build JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: clanginghowl-neoforge-1.21.1-${{ needs.import.outputs.commit }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
